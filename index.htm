<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我最喜愛隨身書投票</title>
    
    <!-- 引入 Google Identity Services (Google OAuth) 核心腳本 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7eb3;
            --secondary: #ff758c;
            --bg-color: #fff0f5;
            --text-color: #555;
        }
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffc3a0 1px, transparent 1px), radial-gradient(#ffc3a0 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: var(--secondary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-weight: 900;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        .view { display: none; animation: fadeIn 0.5s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 15px 30px; font-size: 1.2em;
            font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,117,140,0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); margin: 10px;
        }
        .btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(255,117,140,0.6); }
        .btn-secondary { background: linear-gradient(45deg, #4facfe, #00f2fe); box-shadow: 0 5px 15px rgba(79,172,254,0.4); }
        .btn-secondary:hover { box-shadow: 0 8px 20px rgba(79,172,254,0.6); }

        /* 書本用的自適應網格 */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px; max-width: 900px; margin: 30px auto; padding: 10px;
        }

        /* 年級專用的網格 (強制排成一行三個) */
        .grid-3 {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; max-width: 900px; margin: 20px auto; padding: 10px;
        }

        .card {
            background: white; border-radius: 25px; cursor: pointer; position: relative;
            overflow: hidden; box-shadow: 0 8px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;
        }
        
        .grade-card {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-size: 1.8em; font-weight: 900; color: white; text-align: center; line-height: 1.3;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }
        .grade-card:nth-child(2n) { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .grade-card:nth-child(3n) { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
        .grade-card:hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 15px 25px rgba(0,0,0,0.15); }

        /* 手機版微調：一行三個方格時，避免字體過大 */
        @media (max-width: 500px) {
            .grade-card { font-size: 1.3em; }
        }

        .book-card {
            aspect-ratio: 3/4; background-color: #f0f0f0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 1.1em; color: #888;
            border: 5px solid transparent; padding: 10px; text-align: center; font-weight: bold;
        }
        .book-card img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        .book-card span { z-index: 0; } 
        
        .book-info {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 126, 179, 0.95); color: white; display: flex;
            align-items: center; justify-content: center; padding: 15px; font-size: 1em;
            opacity: 0; transition: opacity 0.3s ease; text-align: left; z-index: 2;
        }
        .book-card:hover .book-info { opacity: 1; }
        
        .book-card.selected {
            border-color: #ff758c; transform: scale(0.95); box-shadow: inset 0 0 15px rgba(255,117,140,0.5);
        }
        .book-card.selected::after {
            content: '✔️'; position: absolute; top: 10px; right: 10px; font-size: 1.5em; z-index: 3;
            background: white; border-radius: 50%; padding: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .leaderboard-item {
            background: white; margin: 10px auto; max-width: 650px; padding: 15px 25px;
            border-radius: 20px; display: flex; justify-content: space-between;
            align-items: center; font-size: 1.2em; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: left;
        }
        .leaderboard-img {
            width: 45px; height: 60px; object-fit: cover; border-radius: 5px; 
            margin: 0 15px; background-color: #f0f0f0; border: 1px solid #ddd;
        }
        .leaderboard-item span.votes {
            background: var(--primary); color: white; padding: 5px 15px; border-radius: 15px; white-space: nowrap; margin-left: 10px;
        }
        
        #user-info { margin-bottom: 20px; font-weight: bold; color: #777; }
        #google-btn-container { display: flex; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="login-view" class="view active">
        <h1>📚 我最喜愛隨身書投票 🌟</h1>
        <p>請使用學校 Google 帳戶登入</p>
        <div id="google-btn-container"></div>
    </div>

        <button class="btn btn-secondary" onclick="showLeaderboardMenu()">🏆 查看龍虎榜</button>
        <button class="btn" style="background: #ccc; box-shadow: none;" onclick="logout()">登出</button>

        const firebaseConfig = {

        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const GOOGLE_CLIENT_ID = "573911894747-0c28hfr0bmkjnn8pkm2msg6sjal1thqe.apps.googleusercontent.com";

        let currentUser = null;
        let currentGrade = '';
        let selectedBooks = [];
        const grades = ['一年級', '二年級', '三年級', '四年級', '五年級', '六年級'];

        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
        
        window.handleGoogleResponse = (response) => {
            const responsePayload = decodeJwtResponse(response.credential);
            currentUser = {
                uid: responsePayload.sub,
                name: responsePayload.name,
                email: responsePayload.email
            };
            document.getElementById('user-info').innerText = `你好，${currentUser.name} (${currentUser.email})`;
            initMainMenu();
            switchView('main-menu-view');
        };

        window.onload = () => {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-btn-container"),
                { theme: "outline", size: "large", shape: "pill", text: "signin_with" }
            );
        };

        window.logout = () => { 
            currentUser = null;
            google.accounts.id.disableAutoSelect();
            switchView('login-view');
        };

        window.switchView = (viewId) => {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        };
        
        window.showMainMenu = () => switchView('main-menu-view');

        function initMainMenu() {
            const gradeGrid = document.getElementById('grade-grid');
            gradeGrid.innerHTML = '';
            grades.forEach(grade => {
                const div = document.createElement('div');
                div.className = 'card grade-card';
                div.innerText = grade;
                div.onclick = () => openGradeVoting(grade);
                gradeGrid.appendChild(div);
            });
        }

        window.openGradeVoting = (grade) => {
            currentGrade = grade;
            selectedBooks = [];
            document.getElementById('voting-title').innerText = `${grade} - 最喜愛隨身書`;
            
            const bookGrid = document.getElementById('book-grid');
            bookGrid.innerHTML = '';

            const gradeBooks = booksConfig[grade];

            gradeBooks.forEach((book, index) => {
                const bookNum = index + 1;
                const displayTitle = book.title !== "" ? book.title : `書本 ${bookNum}`;
                const displayDesc = book.desc !== "" ? book.desc : "精彩簡介稍後補上...";

                const div = document.createElement('div');
                div.className = 'card book-card';
                div.id = book.id;
                
                div.innerHTML = `
                    <img src="${book.img}" alt="${displayTitle}" onerror="this.style.display='none'">
                    <span>${displayTitle}</span>
                    <div class="book-info">${displayDesc}</div>
                `;

                div.onclick = () => {
                    if (selectedBooks.includes(book.id)) {
                        selectedBooks = selectedBooks.filter(id => id !== book.id);
                        div.classList.remove('selected');
                    } else {
                        selectedBooks.push(book.id);
                        div.classList.add('selected');
                    }
                };
                bookGrid.appendChild(div);
            });
            switchView('voting-view');
        };

        window.submitVote = async () => {
            if (selectedBooks.length === 0) {
                alert("請至少選擇一本書！");
                return;
            }
            try {
                const voteRef = doc(db, "votes", currentUser.uid);
                
                await setDoc(voteRef, {
                    studentEmail: currentUser.email,
                    studentName: currentUser.name,
                    [currentGrade]: selectedBooks,
                    lastUpdated: new Date()
                });
                
                alert(`太棒了！你已成功提交 ${currentGrade} 的投票！🎉\n(系統已為你更新為最新紀錄)`);
                showMainMenu();
            } catch (error) {
                alert("投票提交失敗，請檢查網路狀態及 Firebase 安全性規則。錯誤：" + error.message);
            }
        };

        window.showLeaderboardMenu = () => {
            switchView('leaderboard-menu-view');
            const grid = document.getElementById('leaderboard-grid');
            grid.innerHTML = '';
            
            // 建立 1-6 年級方格
            grades.forEach((grade) => {
                const div = document.createElement('div');
                div.className = 'card grade-card';
                div.innerText = grade;
                div.onclick = () => openLeaderboardDetail(grade);
                grid.appendChild(div);
            });
        };

        const getBookInfo = (bookId, grade) => {
            const foundBook = booksConfig[grade].find(b => b.id === bookId);
            if (foundBook) {
                const num = bookId.split('_')[1];
                const title = foundBook.title !== "" ? foundBook.title : `書本 ${num}`;
                return { title: title, img: foundBook.img };
            }
            return { title: bookId, img: '' };
        };

        window.openLeaderboardDetail = async (category) => {
            switchView('leaderboard-detail-view');
            document.getElementById('leaderboard-detail-title').innerText = category === 'top' ? '👑 各級首名' : `🏆 ${category}榜單`;
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = '<p>載入中，請稍候...⏳</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "votes"));
                
                let votersCount = {}; 
                let votesCount = {};  
                
                grades.forEach(g => {
                    votersCount[g] = 0;
                    votesCount[g] = {};
                    booksConfig[g].forEach(b => {
                        votesCount[g][b.id] = 0; 
                    });
                });

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    grades.forEach(g => {
                        if (data[g] && Array.isArray(data[g])) {
                            votersCount[g]++;
                            data[g].forEach(bookId => {
                                if(votesCount[g][bookId] !== undefined) {
                                    votesCount[g][bookId]++;
                                }
                            });
                        }
                    });
                });

                let html = '';

                if (category === 'top') {
                    grades.forEach(grade => {
                        const sortedBooks = Object.entries(votesCount[grade]).sort((a, b) => b[1] - a[1]);
                        if (sortedBooks.length > 0 && sortedBooks[0][1] > 0) { 
                            const topBookId = sortedBooks[0][0];
                            const topBookCount = sortedBooks[0][1];
                            const bookInfo = getBookInfo(topBookId, grade);
                            
                            html += `
                                <div class="leaderboard-item">
                                    <div style="display: flex; align-items: center;">
                                        <span style="font-size: 1.5em; margin-right: 15px;">🏆</span>
                                        <img src="${bookInfo.img}" class="leaderboard-img" onerror="this.style.display='none'">
                                        <div style="display: flex; flex-direction: column;">
                                            <span style="font-size: 0.8em; color: #888; font-weight: normal;">${grade}</span>
                                            <span>${bookInfo.title}</span>
                                        </div>
                                    </div>
                                    <span class="votes">${topBookCount} 票</span>
                                </div>
                            `;
                        }
                    });
                    if (html === '') html = '<p>目前還沒有人投票喔！</p>';
                } 
                else {
                    const grade = category;
                    html += `<p style="font-size: 1.1em; color: #555; margin-bottom: 25px;">👤 本級投票總人數：<span style="font-weight: 900; color: var(--primary);">${votersCount[grade]}</span> 人</p>`;
                    
                    const sortedBooks = Object.entries(votesCount[grade]).sort((a, b) => b[1] - a[1]);
                    
                    sortedBooks.forEach(([bookId, count], index) => {
                        const bookInfo = getBookInfo(bookId, grade);
                        
                        let rankIcon = `<span style="width: 35px; display: inline-block; text-align: center;">${index + 1}.</span>`;
                        if (index === 0 && count > 0) rankIcon = `<span style="font-size: 1.5em; width: 35px; display: inline-block; text-align: center;">🥇</span>`;
                        else if (index === 1 && count > 0) rankIcon = `<span style="font-size: 1.5em; width: 35px; display: inline-block; text-align: center;">🥈</span>`;
                        else if (index === 2 && count > 0) rankIcon = `<span style="font-size: 1.5em; width: 35px; display: inline-block; text-align: center;">🥉</span>`;

                        html += `
                            <div class="leaderboard-item">
                                <div style="display: flex; align-items: center;">
                                    ${rankIcon}
                                    <img src="${bookInfo.img}" class="leaderboard-img" onerror="this.style.display='none'">
                                    <span>${bookInfo.title}</span>
                                </div>
                                <span class="votes">${count} 票</span>
                            </div>
                        `;
                    });
                }

                listDiv.innerHTML = html;

            } catch (error) {
                listDiv.innerHTML = '<p>讀取排行榜失敗，請檢查 Firebase 權限設定。</p>';
                console.error(error);
            }
        };
    </script>
</body>
</html>
